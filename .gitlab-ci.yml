---
# Tameri CI/CD Pipeline
# Stages: test → build OCI images → publish to GitLab Container Registry
#
# Required GitLab CI variables (set in Settings > CI/CD > Variables):
#   CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD  ← auto-provided by GitLab
#
# Image naming convention:
#   registry.gitlab.com/<namespace>/<project>/backend:<tag>
#   registry.gitlab.com/<namespace>/<project>/frontend:<tag>

stages:
  - test
  - build

# ---------------------------------------------------------------------------
# Global variables
# ---------------------------------------------------------------------------
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  # pnpm cache key
  PNPM_CACHE_DIR: ".pnpm-store"

# ---------------------------------------------------------------------------
# Shared: install pnpm dependencies
# ---------------------------------------------------------------------------
.install_deps: &install_deps
  image: node:20-alpine
  before_script:
    - apk add --no-cache libc6-compat
    - corepack enable && corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_CACHE_DIR
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - $PNPM_CACHE_DIR
    policy: pull-push

# ---------------------------------------------------------------------------
# STAGE: test
# ---------------------------------------------------------------------------
test:backend:
  <<: *install_deps
  stage: test
  script:
    - pnpm --filter @tameri/backend lint
    - pnpm --filter @tameri/backend test --passWithNoTests --forceExit --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: apps/backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml
    paths:
      - apps/backend/coverage/
    expire_in: 7 days

test:frontend:
  <<: *install_deps
  stage: test
  script:
    - pnpm --filter @tameri/frontend lint
    - pnpm --filter @tameri/frontend test --passWithNoTests --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: apps/frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml
    paths:
      - apps/frontend/coverage/
    expire_in: 7 days

# ---------------------------------------------------------------------------
# STAGE: build — OCI image template
# ---------------------------------------------------------------------------
.build_oci:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Always tag with commit SHA; add :latest on default branch; add semver tag if tagged
    - |
      TAGS="-t ${IMAGE}:${CI_COMMIT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS -t ${IMAGE}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS -t ${IMAGE}:${CI_COMMIT_TAG}"
      fi
      docker build \
        --file "$DOCKERFILE" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --cache-from "${IMAGE}:latest" \
        $TAGS \
        .
      docker push "${IMAGE}" --all-tags
  needs:
    - job: test:backend
      optional: false
    - job: test:frontend
      optional: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

build:backend:
  extends: .build_oci
  variables:
    IMAGE: "$BACKEND_IMAGE"
    DOCKERFILE: "apps/backend/Dockerfile"
  needs:
    - job: test:backend

build:frontend:
  extends: .build_oci
  variables:
    IMAGE: "$FRONTEND_IMAGE"
    DOCKERFILE: "apps/frontend/Dockerfile"
  needs:
    - job: test:frontend
