# Tameri Project - Development Stack
# ===================================
# Services: App + SuperTokens (Auth) + CouchDB (Database) + MinIO (S3) + imgproxy + Redis + PostgreSQL
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d --build app  # Rebuild and start app
#   docker compose logs -f app        # Follow app logs
#   docker compose down               # Stop all services
#
# Access:
#   - API:                http://localhost:3000
#   - SuperTokens Core:   http://localhost:3567
#   - SuperTokens Dash:   http://localhost:3000/auth/dashboard (via NestJS)
#   - CouchDB Fauxton:    http://localhost:5984/_utils
#   - MinIO Console:      http://localhost:9001
#   - imgproxy:           http://localhost:8080

services:
  # ===================
  # Application (NestJS)
  # ===================
  app:
    container_name: tameri-app
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${PORT:-3000}:3000'
      - '9229:9229'
    command: pnpm run start:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      COUCHDB_URL: http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-admin}@couchdb:5984
      MINIO_ENDPOINT: http://minio:9000
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
    networks:
      - tameri-network
    depends_on:
      couchdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    restart: unless-stopped

  # ===================
  # Cache (Redis)
  # ===================
  redis:
    container_name: tameri-redis
    image: redis:7-alpine
    networks:
      - tameri-network
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================
  # PostgreSQL (Shared Database)
  # ===================
  postgres:
    container_name: tameri-postgres
    image: postgres:16-alpine
    networks:
      - tameri-network
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MULTIPLE_DATABASES: supertokens
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ===================
  # Authentication (SuperTokens)
  # ===================
  supertokens:
    container_name: tameri-supertokens
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    networks:
      - tameri-network
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY:-}
    ports:
      - '${SUPERTOKENS_PORT:-3567}:3567'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3567/hello']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===================
  # Database (CouchDB)
  # ===================
  couchdb:
    container_name: tameri-couchdb
    image: couchdb:3.4.2
    networks:
      - tameri-network
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-admin}
    ports:
      - '${COUCHDB_PORT:-5984}:5984'
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-config:/opt/couchdb/etc/local.d
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
    restart: unless-stopped

  # ===================
  # Object Storage (MinIO - S3 Compatible)
  # ===================
  minio:
    container_name: tameri-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    networks:
      - tameri-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
    restart: unless-stopped

  # ===================
  # Image Processing (imgproxy)
  # ===================
  imgproxy:
    container_name: tameri-imgproxy
    image: ghcr.io/imgproxy/imgproxy:latest
    networks:
      - tameri-network
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      IMGPROXY_ALLOWED_SOURCES: 's3://,http://,https://'
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      # Auto-convert to modern formats when browser supports them
      IMGPROXY_AUTO_WEBP: 'true'
      IMGPROXY_AUTO_AVIF: 'true'
    ports:
      - '${IMGPROXY_PORT:-8080}:8080'
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'imgproxy', 'health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  tameri-network:
    driver: bridge

volumes:
  postgres-data:
  couchdb-data:
  couchdb-config:
  minio-data:
  redis-data:
