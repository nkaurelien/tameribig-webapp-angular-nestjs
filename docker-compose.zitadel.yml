# Tameri Project - Development Stack
# ===================================
# Services: App + Zitadel (Auth) + CouchDB (Database) + MinIO (S3) + Redis
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d --build app  # Rebuild and start app
#   docker compose logs -f app        # Follow app logs
#   docker compose down               # Stop all services
#
# Access:
#   - API:              http://localhost:3000
#   - Zitadel Console:  http://localhost:8080/ui/console
#   - Zitadel Login v2: http://localhost:3001/ui/v2/login
#   - Zitadel Health:   http://localhost:8080/debug/healthz
#   - CouchDB Fauxton:  http://localhost:5984/_utils
#   - MinIO Console:    http://localhost:9001

name: tameri

services:
  # ===================
  # Application (NestJS)
  # ===================
  app:
    container_name: tameri-app
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${PORT:-3000}:3000'
      - '9229:9229'
    command: pnpm run start:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      COUCHDB_URL: http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-admin}@couchdb:5984
      MINIO_ENDPOINT: http://minio:9000
      ZITADEL_ISSUER: http://zitadel:8080
    networks:
      - tameri-network
    depends_on:
      couchdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===================
  # Cache (Redis)
  # ===================
  redis:
    container_name: tameri-redis
    image: redis:7-alpine
    networks:
      - tameri-network
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================
  # Authentication (Zitadel)
  # ===================
  zitadel:
    container_name: tameri-zitadel
    image: ghcr.io/zitadel/zitadel:latest
    command: 'start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}" --tlsMode disabled'
    user: '0'
    networks:
      - tameri-network
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_TLS_ENABLED: false
      # Login v2 configuration
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-data/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:3001/ui/v2/login
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:3001/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:3001/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:3001/ui/v2/login/login?samlRequest=
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - '8080:8080'
      - '3001:3000'  # Login v2 UI (shared network)
    volumes:
      - zitadel-data:/zitadel-data
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Zitadel Login v2 UI
  zitadel-login:
    container_name: tameri-zitadel-login
    image: ghcr.io/zitadel/zitadel-login:latest
    user: '0'
    environment:
      ZITADEL_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel-data/login-client.pat
      CUSTOM_REQUEST_HEADERS: 'Host:localhost'
    network_mode: service:zitadel
    volumes:
      - zitadel-data:/zitadel-data:ro
    depends_on:
      zitadel:
        condition: service_healthy
    restart: unless-stopped

  zitadel-db:
    container_name: tameri-zitadel-db
    image: postgres:16-alpine
    networks:
      - tameri-network
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${ZITADEL_DB_NAME:-zitadel}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d zitadel -U postgres']
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ===================
  # Database (CouchDB)
  # ===================
  couchdb:
    container_name: tameri-couchdb
    image: couchdb:3.4.2
    networks:
      - tameri-network
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-admin}
    ports:
      - '${COUCHDB_PORT:-5984}:5984'
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-config:/opt/couchdb/etc/local.d
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
    restart: unless-stopped

  # ===================
  # Object Storage (MinIO - S3 Compatible)
  # ===================
  minio:
    container_name: tameri-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    networks:
      - tameri-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
    restart: unless-stopped

networks:
  tameri-network:
    driver: bridge

volumes:
  zitadel-data:
  zitadel-db-data:
  couchdb-data:
  couchdb-config:
  minio-data:
  redis-data:
